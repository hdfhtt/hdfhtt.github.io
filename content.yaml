profile:
  name: Hadif Hatta
  image-src: "/assets/profile.jpg"
  title: Android Developer
  title-alt: VigTech Labs Sdn Bhd
  summary: |
    A passionate computer science student with a strong background in software development, seeking to
     expand skills and gain experience in the software engineering field.

projects:
  - skinmnemonist:
    name: SkinMnemonist
    desc: |
      A mobile application developed for my final year project during Bachelor's degree, designed to help users track
      and manage their skincare product usage, ensuring timely replenishment.
    icon-src: "/assets/icons/smm.png"
    thumbs-src: "/assets/thumbs/smm.png"
    buttons:
      - label: Poster
        icon-src: "/assets/brands/imgur.svg"
        link: "https://i.imgur.com/zIsA6qp.jpeg"
      - label: Download Beta
        icon-src: "/assets/brands/googleplay.svg"
        link: "https://play.google.com/store/apps/details?id=dev.hdfhtt.skinmnemonist"
    new: true

  - cupcakelab:
    name: CupCakeLab
    desc: |
      A Flutter-based mobile application showcasing the implementation of the framework and Material
      Design principles. It allows users to browse, search, and save their favorite cupcake recipes
      using the Spoonacular API.
    icon-src: "/assets/icons/cupcakelab.png"
    thumbs-src: "/assets/thumbs/cupcakelab.png"
    buttons:
      - label: Design
        icon-src: "/assets/brands/figma.svg"
        link: "https://www.figma.com/design/s3r5E9pcbQcgzc0reHnzXm/App%3A-CupCakeLab?node-id=54195-34798&t=QZXv0L8uJcp7rblk-1"
      - label: Demo
        icon-src: "/assets/brands/github.svg"
        link: "https://github.com/hdfhtt/CupCakeLab"

  - lapar:
    name: Sistem Aplikasi Lapar
    desc: |
      A conceptual mobile application designed for a Bahasa Melayu class project. It aims to
      streamline the food ordering process for the IIUM Gombak Campus community at cafeterias and
      restaurants.
    icon-src: "/assets/icons/lapar.png"
    thumbs-src: "/assets/thumbs/lapar.png"
    buttons:
      - label: Design
        icon-src: "/assets/brands/figma.svg"
        link: "https://www.figma.com/design/kvaclNuFEoFeIaUd1XlXyN/Sistem-Aplikasi-Lapar?node-id=0-1&t=flCKxkpnmhx1ZrCq-1"

  - kproject.gis:
    name: KProject.GIS
    desc: |
      As part of my internship during Diploma, this web-based Geographical Information System (GIS) platform is built to identify potential strategic locations for new branches.
      This data science project showcases my development and data science skills.
    thumbs-src: "/assets/thumbs/kproject-gis.jpg"
    buttons:
      - label: Screenshots
        icon-src: "/assets/brands/imgur.svg"
        link: "https://imgur.com/a/kproject-gis-snapshots-RTtVdBJ"

  - pastel-ux:
    name: Pastel UX
    desc: |
      A project focused on creating a soft and delicate pastel-colored icon pack based on Google's
      Material Design guidelines. Initially conceived as a UI/UX redesign project, it ultimately
      concentrated on color palettes and icon design. This app achieved 100K of downloads on Play Store.
    icon-src: "/assets/icons/pastel-ux.png"
    thumbs-src: "/assets/thumbs/pastel-ux.png"
    buttons:
      - label: Screenshots
        icon-src: "/assets/brands/imgur.svg"
        link: "https://imgur.com/a/pastel-ux-feedbacks-8vpOENB"
      - label: Web Archive
        icon-src: "/assets/brands/googleplay.svg"
        link: "https://web.archive.org/web/20220525070416/https://play.google.com/store/apps/details?id=hdfhtt.pastel.app"
    label: Discontinued

  # ...
  # - project-n

